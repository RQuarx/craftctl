[package]
name = "craftctl"
version = "0.1.0"
edition = "2024"

[dependencies]
crossterm = "0.29.0"
ctrlc = "3.5.1"
reqwest = { version = "0.13.4", features = ["form", "json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.18"
clap = "4.6.1"
json = "0.12.4"
ratatui = "0.30.1"
sha1 = "0.11.0"
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread", "time"] }
toml = "1.1.2"
walkdir = "2.5.0"
zip = "8.6.0"
